[project]
name = "savingstracker"
version = "0.1.0"
description = "Personal finance tracker with custom KPIs, bank connections, and savings projections"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # Telegram bot
    "python-telegram-bot[job-queue]>=21.5",
    # Bank connection
    "fints>=4.1.0",
    # KPI engine
    "asteval>=1.0.5",
    # Config & security
    "pydantic-settings>=2.5.0",
    "cryptography>=43.0.0",
    # Utilities
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
