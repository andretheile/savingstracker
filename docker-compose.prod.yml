# Production compose for IONOS: no published ports, Traefik on the proxy network.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savingstracker
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: savingstracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savingstracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/andretheile/savingstracker:latest
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://savingstracker:${DB_PASSWORD}@db:5432/savingstracker
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://savings.tradercouncil.app}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-x-ai/grok-4.6}
      FINTS_PRODUCT_ID: ${FINTS_PRODUCT_ID:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "false"
    command: python -m src.main
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.savingstracker.rule=Host(`savings.tradercouncil.app`)
      - traefik.http.routers.savingstracker.entrypoints=websecure
      - traefik.http.routers.savingstracker.tls.certresolver=myresolver
      - traefik.http.services.savingstracker.loadbalancer.server.port=8000
      - traefik.docker.network=proxy

  worker:
    image: ghcr.io/andretheile/savingstracker:latest
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://savingstracker:${DB_PASSWORD}@db:5432/savingstracker
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://savings.tradercouncil.app}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-x-ai/grok-4.6}
      FINTS_PRODUCT_ID: ${FINTS_PRODUCT_ID:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: celery -A src.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  beat:
    image: ghcr.io/andretheile/savingstracker:latest
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://savingstracker:${DB_PASSWORD}@db:5432/savingstracker
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: celery -A src.celery_app beat --loglevel=info
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  proxy:
    external: true
